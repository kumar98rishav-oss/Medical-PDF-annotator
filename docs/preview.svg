<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="1160" height="720" rx="18" fill="#eef2f7" stroke="#dbe2ea" stroke-width="1.5"/>

  <!-- top header (dark) -->
  <rect x="20" y="20" width="1160" height="70" rx="18" fill="#0f172a"/>
  <rect x="20" y="54" width="1160" height="36" fill="#0f172a"/>
  <rect x="48" y="40" width="34" height="34" rx="9" fill="#0e2a33"/>
  <text x="56" y="64" font-size="19">🩺</text>
  <text x="94" y="58" fill="#e2e8f0" font-size="20" font-weight="800">MedAnnotate <tspan fill="url(#cyan)">AI</tspan></text>
  <text x="94" y="76" fill="#64748b" font-size="11">Powered by Rishav.K · Workspace</text>
  <rect x="1010" y="42" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="1075" y="62" fill="#cbd5e1" font-size="13" text-anchor="middle">⚙ Admin Settings</text>

  <!-- left library -->
  <rect x="20" y="90" width="300" height="650" fill="#f8fafc"/>
  <text x="44" y="128" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.5">LIBRARY</text>
  <rect x="44" y="142" width="252" height="70" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
  <rect x="58" y="158" width="34" height="40" rx="5" fill="#0ea5e9"/><text x="63" y="185" fill="#fff" font-size="12">PDF</text>
  <text x="104" y="170" fill="#0f172a" font-size="14" font-weight="700">medical_record.pdf</text>
  <text x="104" y="190" fill="#64748b" font-size="12">248 pages · 12 visits</text>
  <!-- upload dropzone -->
  <rect x="44" y="228" width="252" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="170" y="286" font-size="26" text-anchor="middle">⬆️</text>
  <text x="170" y="312" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">Upload PDF</text>
  <text x="170" y="332" fill="#94a3b8" font-size="12" text-anchor="middle">Drag &amp; drop or click</text>

  <!-- center: PDF page with highlighted visit ranges -->
  <rect x="336" y="106" width="470" height="618" rx="10" fill="#e9edf3"/>
  <rect x="396" y="132" width="350" height="470" rx="6" fill="#ffffff" stroke="#d7dee7"/>
  <!-- text lines -->
  <g fill="#e2e8f0">
    <rect x="420" y="160" width="300" height="9" rx="4"/>
    <rect x="420" y="180" width="260" height="9" rx="4"/>
  </g>
  <!-- highlighted visit band 1 (teal) -->
  <rect x="410" y="212" width="322" height="86" rx="6" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="422" y="232" fill="#0f766e" font-size="11" font-weight="700">VISIT · pp. 12–18</text>
  <rect x="422" y="244" width="250" height="8" rx="4" fill="#99f6e4"/>
  <rect x="422" y="262" width="290" height="8" rx="4" fill="#99f6e4"/>
  <rect x="422" y="280" width="210" height="8" rx="4" fill="#99f6e4"/>
  <!-- highlighted visit band 2 (amber) -->
  <rect x="410" y="320" width="322" height="86" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="422" y="340" fill="#b45309" font-size="11" font-weight="700">VISIT · pp. 19–24</text>
  <rect x="422" y="352" width="270" height="8" rx="4" fill="#fde68a"/>
  <rect x="422" y="370" width="230" height="8" rx="4" fill="#fde68a"/>
  <rect x="422" y="388" width="280" height="8" rx="4" fill="#fde68a"/>
  <g fill="#eef1f6">
    <rect x="420" y="430" width="300" height="9" rx="4"/>
    <rect x="420" y="450" width="240" height="9" rx="4"/>
  </g>
  <!-- page thumbnail strip -->
  <g>
    <rect x="396" y="626" width="46" height="60" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <rect x="452" y="626" width="46" height="60" rx="4" fill="#fff" stroke="#14b8a6" stroke-width="2"/>
    <rect x="508" y="626" width="46" height="60" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <rect x="564" y="626" width="46" height="60" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="620" y="626" width="46" height="60" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <rect x="676" y="626" width="46" height="60" rx="4" fill="#fff" stroke="#cbd5e1"/>
  </g>

  <!-- right: visit form -->
  <rect x="820" y="106" width="340" height="618" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="846" y="140" fill="#0f172a" font-size="16" font-weight="800">Visit Details</text>
  <text x="846" y="160" fill="#14b8a6" font-size="12" font-weight="600">Pages 12–18 · AI-suggested</text>
  <g font-size="12">
    <text x="846" y="196" fill="#64748b">Date of Service</text>
    <rect x="846" y="204" width="288" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="860" y="226" fill="#0f172a" font-size="13">03 / 14 / 2026</text>
    <text x="846" y="266" fill="#64748b">Facility</text>
    <rect x="846" y="274" width="288" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="860" y="296" fill="#0f172a" font-size="13">North Valley Ortho Institute</text>
    <text x="846" y="336" fill="#64748b">Provider</text>
    <rect x="846" y="344" width="288" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="860" y="366" fill="#0f172a" font-size="13">Dr. A. Mehta</text>
    <text x="846" y="406" fill="#64748b">Document Type</text>
    <rect x="846" y="414" width="139" height="34" rx="8" fill="#ecfeff" stroke="#67e8f9"/><text x="915" y="436" fill="#0e7490" font-size="13" text-anchor="middle">Medical Record</text>
    <rect x="995" y="414" width="139" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1064" y="436" fill="#64748b" font-size="13" text-anchor="middle">Medical Bill</text>
  </g>
  <!-- actions -->
  <rect x="846" y="500" width="288" height="42" rx="10" fill="url(#cyan)"/>
  <text x="990" y="527" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Save Visit</text>
  <rect x="846" y="556" width="139" height="40" rx="10" fill="#f1f5f9"/><text x="915" y="581" fill="#475569" font-size="13" text-anchor="middle">⚡ AI Extract</text>
  <rect x="995" y="556" width="139" height="40" rx="10" fill="#f1f5f9"/><text x="1064" y="581" fill="#475569" font-size="13" text-anchor="middle">🔍 OCR Range</text>
  <!-- process footer -->
  <rect x="846" y="632" width="288" height="66" rx="10" fill="#0f172a"/>
  <text x="866" y="662" fill="#94a3b8" font-size="12">Ready to build</text>
  <rect x="866" y="670" width="120" height="20" rx="10" fill="#134e4a"/><text x="926" y="684" fill="#5eead4" font-size="11" text-anchor="middle">📑 Combined</text>
  <rect x="994" y="670" width="120" height="20" rx="10" fill="#1e293b"/><text x="1054" y="684" fill="#94a3b8" font-size="11" text-anchor="middle">🗂 Split ZIP</text>
</svg>
