# Render Blueprint — Medical-PDF-annotator (FastAPI serving pre-built frontend)
# Deploy: Render dashboard → New → Blueprint → connect this repo.
# Docker build so the Tesseract OCR engine is available at runtime (see Dockerfile).
# The built frontend is committed under backend/static and served by FastAPI.
services:
  - type: web
    name: medical-pdf-annotator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
