# Render Blueprint — Medical-PDF-annotator (FastAPI serving pre-built frontend)
# Deploy: Render dashboard → New → Blueprint → connect this repo.
# The built frontend is committed under backend/static and served by FastAPI,
# so no Node build step is needed here.
services:
  - type: web
    name: medical-pdf-annotator
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
